<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sofran — Something Big Is Coming</title>
  <meta name="description" content="Something big is coming to Sofran. A new home and lifestyle experience is on its way." />
  <meta name="keywords" content="Sofran, home, lifestyle, premium home, lifestyle brand" />
  <meta name="author" content="Sofran" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#F4EEE5" />

  <!-- Canonical -->
  <link rel="canonical" href="https://sofran.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png"
        href="https://res.cloudinary.com/sfjl53dg/image/upload/v1789677644/FeviconWebIcon_em0wje.png" />
  <link rel="apple-touch-icon"
        href="https://res.cloudinary.com/sfjl53dg/image/upload/v1789677644/FeviconWebIcon_em0wje.png" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sofran.com/" />
  <meta property="og:title" content="Sofran — Something Big Is Coming" />
  <meta property="og:description" content="Something big is coming to Sofran. Stay tuned." />
  <meta property="og:image"
        content="https://res.cloudinary.com/sfjl53dg/image/upload/v1789682304/MainLogo_hbwde5.png" />
  <meta property="og:image:alt" content="Sofran — Home / Lifestyle / More" />
  <meta property="og:site_name" content="Sofran" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sofran — Something Big Is Coming" />
  <meta name="twitter:description" content="Something big is coming to Sofran. Stay tuned." />
  <meta name="twitter:image"
        content="https://res.cloudinary.com/sfjl53dg/image/upload/v1789682304/MainLogo_hbwde5.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ivory: #F4EEE5;
      --cream: #FBF9F5;
      --charcoal: #20211F;
      --text: #514B43;
      --muted: #82786D;
      --bronze: #A67C52;
      --border: #D8CCBD;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.72), transparent 34%),
        linear-gradient(135deg, var(--ivory), #eee5d9);
      color: var(--charcoal);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 24px;
      text-align: center;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .content {
      width: min(780px, 100%);
      position: relative;
      z-index: 2;
      animation: reveal 1.1s ease both;
    }

    .logo {
      width: min(420px, 76vw);
      height: auto;
      display: block;
      margin: 0 auto 46px;
      filter: drop-shadow(0 12px 24px rgba(32,33,31,.08));
    }

    .eyebrow {
      font-size: 11px;
      line-height: 1;
      letter-spacing: .30em;
      text-transform: uppercase;
      color: var(--bronze);
      margin-bottom: 22px;
      font-weight: 600;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(58px, 9vw, 104px);
      line-height: .86;
      font-weight: 600;
      letter-spacing: -.035em;
      margin-bottom: 28px;
    }

    .line {
      width: 74px;
      height: 1px;
      background: var(--bronze);
      margin: 0 auto 27px;
      position: relative;
    }

    .line::after {
      content: "";
      width: 7px;
      height: 7px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--bronze);
    }

    .message {
      max-width: 550px;
      margin: 0 auto;
      color: var(--text);
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: .01em;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      left: 24px;
      right: 24px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .20em;
      text-transform: uppercase;
    }

    .orb {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(166,124,82,.16);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: breathe 5s ease-in-out infinite;
      pointer-events: none;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: 25px;
      border: 1px solid rgba(166,124,82,.10);
      border-radius: 50%;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(.96); opacity: .5; }
      50% { transform: translate(-50%, -50%) scale(1.04); opacity: 1; }
    }

    @media (max-width: 600px) {
      .page {
        padding: 28px 20px 80px;
      }

      .logo {
        width: min(330px, 82vw);
        margin-bottom: 40px;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: .23em;
      }

      h1 {
        font-size: clamp(52px, 17vw, 76px);
      }

      .message {
        font-size: 14px;
        line-height: 1.7;
      }

      .orb {
        width: 220px;
        height: 220px;
      }

      .footer {
        bottom: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="grain"></div>
    <div class="orb"></div>

    <section class="content" aria-label="Sofran coming soon">
      <img
        class="logo"
        src="https://res.cloudinary.com/sfjl53dg/image/upload/v1789682304/MainLogo_hbwde5.png"
        alt="Sofran — Home / Lifestyle / More"
      />

      <p class="eyebrow">A New Chapter Is Near</p>

      <h1>Something Big<br />Is Coming.</h1>

      <div class="line"></div>

      <p class="message">
        We’re creating something considered, beautiful and made to stay.
        Sofran is getting ready to bring a new home &amp; lifestyle experience to life.
        Stay tuned.
      </p>
    </section>

    <footer class="footer">
      Sofran &nbsp;·&nbsp; Home / Lifestyle / More
    </footer>
  </main>
</body>
</html>
